[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "Security Intelligence Console for AI Data Leak Detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LEAKGUARD Team" }
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
    "hypothesis>=6.100.0",
]
ner = [
    "spacy>=3.7.0,<3.9.0",
    "presidio-analyzer>=2.2.350",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "notebooks",
    ".venv",
    "venv",
    "*venv*",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/leakguard/data/templates.py" = ["E501"]
"app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
